<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>LedgerMate - Goals</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="frame">
  <div class="header">
    <div class="logo script">Goals</div>
    <div class="date">Kamis: 29-Oct-26</div>
  </div>

  <div class="card">
    <div class="card-row" style="margin-bottom:14px;">
      <span class="section-title script">Laptop Baru</span>
      <span class="card-label">Target: 15 Des 2026</span>
    </div>
    <div style="height:6px; background:var(--surface-2); border-radius:999px; margin-bottom:10px; overflow:hidden;">
      <div style="height:100%; width:62%; background:var(--burgundy);"></div>
    </div>
    <div class="card-row">
      <span class="card-label">Rp 9.300.000 / Rp 15.000.000</span>
      <span style="color:#fff; font-size:13px; font-weight:700;">62%</span>
    </div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <div class="pill" style="flex:1; justify-content:center; background:transparent; border:1px solid var(--border); color:var(--ink);">Tarik dari Goal</div>
      <div class="pill" style="flex:1; justify-content:center; background:var(--burgundy); color:#fff;">Edit</div>
    </div>
  </div>

  <div class="card">
    <div class="card-row" style="margin-bottom:14px;">
      <span class="section-title script">Dana Darurat</span>
      <span class="card-label">Target: 1 Jun 2027</span>
    </div>
    <div style="height:6px; background:var(--surface-2); border-radius:999px; margin-bottom:10px; overflow:hidden;">
      <div style="height:100%; width:28%; background:var(--burgundy);"></div>
    </div>
    <div class="card-row">
      <span class="card-label">Rp 2.800.000 / Rp 10.000.000</span>
      <span style="color:#fff; font-size:13px; font-weight:700;">28%</span>
    </div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      <div class="pill" style="flex:1; justify-content:center; background:transparent; border:1px solid var(--border); color:var(--ink);">Tarik dari Goal</div>
      <div class="pill" style="flex:1; justify-content:center; background:var(--burgundy); color:#fff;">Edit</div>
    </div>
  </div>

  <div class="card" style="border:1px dashed var(--border); background:transparent; text-align:center; padding:28px 16px;">
    <div style="font-size:22px; color:#fff; margin-bottom:8px;">+</div>
    <div class="card-label script" style="font-size:14px;">Tambah Goal Baru</div>
  </div>

  <div class="fab">+</div>

  <div class="bottom-nav">
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span class="script">Home</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v16H4zM4 10h16M9 4v16"/></svg><span class="script">Transaction</span></div>
    <div class="nav-item active"><div class="nav-underline"></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span class="script">Goals</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 21V9l8-6 8 6v12M9 21v-6h6v6"/></svg><span class="script">Asset</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19V10M10 19V4M16 19v-7M4 19h16"/></svg><span class="script">Analysis</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M4 7h4M4 12h7M4 17h4M16 7h4M13 12h7M16 17h4"/></svg><span class="script">Settings</span></div>
  </div>
</div>
</body>
</html>
